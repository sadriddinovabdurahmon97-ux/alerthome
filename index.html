<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yer Qimirlash">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Yer Qimirlash</title>
<link rel="icon" type="image/png" href="favicon.png?v=6">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=6">
<link rel="manifest" href="manifest.webmanifest?v=6">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Yer Qimirlash — "tun va tong" mavzusi: tinch paytda osoyishta binafsha-moviy, xavfda marjon-qizil */
:root {
  --basalt: #0e1626;        /* fon */
  --rock: #152036;          /* karta */
  --rock-2: #1b2943;        /* ichki yuza */
  --seam: #273a5c;          /* chiziqlar */
  --ash: #eef2fb;           /* asosiy matn */
  --dust: #93a3c2;          /* ikkinchi darajali matn */
  --brand: #8b7bff;
  --brand-2: #38bdf8;
  --lava: #ff5a5f;          /* xavf */
  --ember: #ffb547;
  --moss: #34d399;
  --amber: #fbbf24;
  --sky: #38bdf8;
  --lava-wash: rgb(255 90 95 / 0.16);
  --moss-wash: rgb(52 211 153 / 0.14);
  --brand-wash: rgb(139 123 255 / 0.16);
  --glow: rgb(139 123 255 / 0.75);
  --shadow: 0 1px 0 rgb(255 255 255 / 0.04) inset, 0 18px 44px rgb(3 8 20 / 0.45);
  --f-display: "Manrope", "Segoe UI", system-ui, sans-serif;
  --f-body: "Onest", "Segoe UI", system-ui, sans-serif;
  --pad: 22px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --basalt: #f3f5fb; --rock: #ffffff; --rock-2: #f1f3fa; --seam: #dde3f0; --ash: #121a2c; --dust: #5d6b88;
    --brand: #6d5cf6; --brand-2: #0ea5e9; --lava: #e5484d; --ember: #f08c00; --moss: #12a46c; --amber: #d18a00; --sky: #0ea5e9;
    --lava-wash: rgb(229 72 77 / 0.10); --moss-wash: rgb(18 164 108 / 0.10); --brand-wash: rgb(109 92 246 / 0.10);
    --glow: rgb(109 92 246 / 0.35); --shadow: 0 1px 2px rgb(20 30 60 / 0.05), 0 12px 32px rgb(20 30 60 / 0.07);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --basalt: #f3f5fb; --rock: #ffffff; --rock-2: #f1f3fa; --seam: #dde3f0; --ash: #121a2c; --dust: #5d6b88;
  --brand: #6d5cf6; --brand-2: #0ea5e9; --lava: #e5484d; --ember: #f08c00; --moss: #12a46c; --amber: #d18a00; --sky: #0ea5e9;
  --lava-wash: rgb(229 72 77 / 0.10); --moss-wash: rgb(18 164 108 / 0.10); --brand-wash: rgb(109 92 246 / 0.10);
  --glow: rgb(109 92 246 / 0.35); --shadow: 0 1px 2px rgb(20 30 60 / 0.05), 0 12px 32px rgb(20 30 60 / 0.07);
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; min-width: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overflow-x: hidden; }
body {
  margin: 0; background: var(--basalt); color: var(--ash);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(36px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  overflow-x: hidden; width: 100%;
  background-image: radial-gradient(1100px 520px at 85% -120px, var(--brand-wash), transparent 70%);
  background-repeat: no-repeat;
}
img, svg, canvas { max-width: 100%; }
input { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 8px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; flex: 1 1 auto; }
.brand > div { min-width: 0; }
.brand svg { width: 46px; height: 46px; flex: none; display: block; filter: drop-shadow(0 6px 16px rgb(110 100 255 / 0.35)); }
.brand b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { display: block; color: var(--dust); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--rock); border: 1px solid var(--seam); font-size: 13px; font-weight: 600; white-space: nowrap; flex: none; }
.status i { width: 9px; height: 9px; border-radius: 50%; background: var(--dust); flex: none; }
.status.on i { background: var(--moss); box-shadow: 0 0 0 4px var(--moss-wash); }
.status.bad i { background: var(--lava); box-shadow: 0 0 0 4px var(--lava-wash); }
.ib { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 12px; background: var(--rock); border: 1px solid var(--seam); padding: 0; position: relative; }
.ib svg { width: 19px; height: 19px; }
.ib:hover { border-color: var(--brand); }
.ib.on::after { content: ""; position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--moss); }
.ib.lang { font-family: var(--f-display); font-weight: 800; font-size: 12px; }

/* ---------- hero ---------- */
.hero {
  position: relative; overflow: hidden; border-radius: 26px; border: 1px solid var(--seam);
  background:
    radial-gradient(600px 300px at 100% 0%, var(--brand-wash), transparent 70%),
    radial-gradient(500px 260px at 0% 100%, rgb(56 189 248 / 0.08), transparent 70%),
    var(--rock);
  box-shadow: var(--shadow);
  padding: var(--pad) var(--pad) 18px;
  display: grid; gap: 16px;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.hero-top { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
.state { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--moss); background: var(--moss-wash); padding: 5px 12px; border-radius: 999px; }
.state i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: beat 2s infinite; }
@keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.headline h1 { margin: 12px 0 4px; font-family: var(--f-display); font-weight: 800; font-size: clamp(28px, 6vw, 50px); line-height: 1.05; letter-spacing: -0.035em; text-wrap: balance; overflow-wrap: anywhere; }
.headline p { margin: 0; color: var(--dust); max-width: 46ch; }

.gauge { position: relative; width: 128px; height: 128px; flex: none; }
.gauge svg { width: 100%; height: 100%; transform: rotate(135deg); }
.gauge .track { stroke: var(--seam); }
.gauge .fill { stroke: var(--moss); transition: stroke-dashoffset 0.6s cubic-bezier(.2,.8,.2,1), stroke 0.3s; }
.gauge .val { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.gauge .val b { font-family: var(--f-display); font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -0.04em; }
.gauge .val span { font-size: 12.5px; color: var(--dust); margin-top: 2px; }

.scope { position: relative; background: var(--rock-2); border-radius: 18px; padding: 10px 12px 8px; }
canvas#cv { display: block; width: 100%; height: 230px; touch-action: pan-y; }
.scope-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--dust); }
.scope-foot b { color: var(--ash); font-weight: 600; }
.tip { position: absolute; top: 8px; pointer-events: none; background: var(--rock); border: 1px solid var(--seam); border-radius: 14px; padding: 10px 13px; font-size: 13px; line-height: 1.55; box-shadow: 0 12px 34px rgb(0 0 0 / 0.3); min-width: 170px; font-variant-numeric: tabular-nums; }
.tip b { font-family: var(--f-display); font-weight: 800; font-size: 15px; color: var(--brand); }
.tip span { color: var(--dust); }

.feel { display: grid; gap: 8px; }
.segs { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.segs i { height: 9px; border-radius: 5px; background: var(--seam); transition: background 0.25s; }
.segs i.on { background: var(--moss); }
.segs i.on.m { background: var(--amber); }
.segs i.on.h { background: var(--lava); box-shadow: 0 0 10px var(--lava-wash); }
.feel p { margin: 0; font-size: 14px; color: var(--dust); }
.feel p b { color: var(--ash); font-weight: 700; }

.hero.alarm { border-color: var(--lava); box-shadow: 0 0 0 1px var(--lava), 0 0 60px var(--lava-wash), var(--shadow);
  background: radial-gradient(700px 320px at 100% 0%, var(--lava-wash), transparent 70%), var(--rock); }
.hero.alarm .state { color: var(--lava); background: var(--lava-wash); }
.hero.alarm .state i { animation-duration: 0.6s; }
.hero.alarm h1 { color: var(--lava); }
.hero.off .state { color: var(--dust); background: var(--rock-2); }
.hero.off .state i { animation: none; }
.hero.shake { animation: shake 0.7s cubic-bezier(.36,.07,.19,.97) 2; }
@keyframes shake {
  10%, 90% { transform: translate(-1px, 0); } 20%, 80% { transform: translate(3px, -1px); }
  30%, 50%, 70% { transform: translate(-5px, 1px); } 40%, 60% { transform: translate(5px, -1px); }
}
@media (prefers-reduced-motion: reduce) { .hero.shake { animation: none; } .state i { animation: none; } }

.guide { display: none; border-radius: 18px; padding: 16px 18px; background: var(--lava); color: #fff; }
.hero.alarm .guide { display: block; }
.guide h3 { margin: 0 0 8px; font-family: var(--f-display); font-size: 17px; font-weight: 800; }
.guide ol { margin: 0; padding-left: 20px; display: grid; gap: 3px; }

/* ---------- cards ---------- */
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); grid-template-areas: "sens ctrl" "log ctrl"; grid-template-rows: auto 1fr; gap: 18px; align-items: start; }
.a-sens { grid-area: sens; } .a-ctrl { grid-area: ctrl; } .a-log { grid-area: log; }
.card { background: var(--rock); border: 1px solid var(--seam); border-radius: 22px; padding: var(--pad); box-shadow: var(--shadow); }
.card h2 { margin: 0 0 16px; font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: -0.02em; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card h2 small { font-family: var(--f-body); font-weight: 500; font-size: 13px; color: var(--dust); letter-spacing: 0; }
.chart { display: block; width: 100%; height: 180px; touch-action: pan-y; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0 0; font-size: 13px; color: var(--dust); font-variant-numeric: tabular-nums; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend b { color: var(--ash); font-weight: 600; }
.note { margin: 10px 0 0; font-size: 13px; color: var(--dust); }
.dom { margin: 12px 0 0; font-size: 14px; color: var(--dust); }
.dom b { font-family: var(--f-display); font-weight: 800; color: var(--ash); }
.fw { display: none; margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--rock-2); border: 1px dashed var(--seam); font-size: 13px; color: var(--dust); }
.fw.show { display: block; }

/* sensors */
.sensors { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.sensor { padding: 12px 14px; border-radius: 16px; background: var(--rock-2); border: 1px solid transparent; }
.sensor.ok { border-color: color-mix(in srgb, var(--moss) 35%, transparent); }
.sensor.crit { border-color: var(--lava); background: var(--lava-wash); }
.sensor .k { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--dust); }
.sensor .k svg { width: 16px; height: 16px; flex: none; }
.sensor .v { font-family: var(--f-display); font-weight: 800; font-size: 18px; margin-top: 6px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sensor.ok .v { color: var(--moss); }
.sensor.crit .v { color: var(--lava); }

/* controls */
.row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 0; border-top: 1px solid var(--seam); }
.row:first-of-type { border-top: 0; padding-top: 0; }
.row .t b { display: block; font-weight: 700; font-size: 15px; }
.row .t span { display: block; color: var(--dust); font-size: 13px; }
.sw { position: relative; width: 54px; height: 32px; flex: none; border-radius: 999px; border: 1px solid var(--seam); background: var(--rock-2); padding: 0; transition: background 0.2s, border-color 0.2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--dust); transition: transform 0.2s cubic-bezier(.2,.8,.2,1), background 0.2s; }
.sw[aria-checked="true"] { background: var(--brand); border-color: var(--brand); }
.sw[aria-checked="true"]::after { transform: translateX(22px); background: #fff; }
.btn { border: 0; border-radius: 14px; padding: 11px 18px; font-weight: 700; color: #fff; flex: none;
  background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: 0 8px 22px rgb(110 100 255 / 0.3); }
.btn:active { transform: translateY(1px); }
.ghost { border-radius: 14px; padding: 10px 16px; font-weight: 600; background: var(--rock-2); color: var(--ash); border: 1px solid var(--seam); }
.ghost:hover { border-color: var(--brand); }
.btn:disabled, .ghost:disabled, .sw:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.thr-box { padding-top: 14px; border-top: 1px solid var(--seam); display: grid; gap: 8px; }
.thr-head { display: flex; justify-content: space-between; align-items: baseline; }
.thr-head b { font-weight: 700; }
.thr-head span { font-family: var(--f-display); font-weight: 800; color: var(--brand); font-variant-numeric: tabular-nums; }
.thr-ends { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--dust); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 99px; background: linear-gradient(90deg, var(--lava), var(--amber) 50%, var(--moss)); margin: 10px 0 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 4px solid var(--brand); box-shadow: 0 4px 12px rgb(0 0 0 / 0.25); }
input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 4px solid var(--brand); }

/* alert timeline */
.log { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow: auto; }
.log li { position: relative; padding: 0 0 16px 24px; }
.log li::before { content: ""; position: absolute; left: 5px; top: 18px; bottom: 0; width: 2px; background: var(--seam); }
.log li:last-child::before { display: none; }
.log li::after { content: ""; position: absolute; left: 0; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 4px var(--rock); }
.log li.q::after, .log li.f::after { background: var(--lava); }
.log li time { display: block; font-size: 12.5px; color: var(--dust); font-variant-numeric: tabular-nums; }
.log li div { font-weight: 500; overflow-wrap: anywhere; }
.empty { color: var(--dust); padding: 6px 0 2px; margin: 0; }

/* passports */
.passes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.pass { border-radius: 18px; background: var(--rock-2); border: 1px solid var(--seam); padding: 16px; display: grid; gap: 12px; }
.pass-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.pass-head b { font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
.pass-head time { font-size: 12.5px; color: var(--dust); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pass canvas { display: block; width: 100%; height: 64px; }
.pass dl { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.pass dt { font-size: 12px; color: var(--dust); }
.pass dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.pass.h { border-color: var(--lava); }
.pass.h .pass-head b { color: var(--lava); }

/* official quakes */
.tabs, .seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--rock-2); border: 1px solid var(--seam); max-width: 100%; }
.tabs { margin-bottom: 14px; }
.tabs button, .seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--dust); white-space: nowrap; }
.tabs button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.mapwrap { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }
#map { height: 340px; border-radius: 16px; border: 1px solid var(--seam); background: var(--rock-2); z-index: 0; overflow: hidden; }
.qlist { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow: auto; display: grid; gap: 2px; }
.qlist li { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 12px; align-items: center; padding: 9px 6px; border-radius: 12px; cursor: pointer; }
.qlist li:hover { background: var(--rock-2); }
.mag { width: 50px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 15px; color: #fff; background: var(--amber); }
.mag.m5 { background: var(--ember); } .mag.m6 { background: var(--lava); }
.mag.m4 { background: color-mix(in srgb, var(--amber) 85%, var(--rock-2)); color: #1c1412; }
.mag.m3 { background: var(--seam); color: var(--ash); }
.qlist .pl { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qlist .mt { font-size: 12.5px; color: var(--dust); font-variant-numeric: tabular-nums; }
.leaflet-container { font-family: var(--f-body); max-width: 100%; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--rock); color: var(--ash); }
.leaflet-popup-content { margin: 10px 12px; font-size: 13px; line-height: 1.5; }

.foot { color: var(--dust); font-size: 12.5px; text-align: center; margin: 4px 0 0; }

dialog { background: var(--rock); color: var(--ash); border: 1px solid var(--seam); border-radius: 24px; padding: 22px; width: min(460px, calc(100vw - 24px)); max-width: calc(100vw - 24px); box-shadow: 0 30px 80px rgb(0 0 0 / 0.45); }
dialog::backdrop { background: rgb(5 10 20 / 0.6); backdrop-filter: blur(6px); }
dialog h3 { margin: 0 0 6px; font-family: var(--f-display); font-size: 21px; font-weight: 800; }
dialog p { color: var(--dust); margin: 0 0 14px; }
dialog code { color: var(--ash); }
label { display: block; font-size: 13px; color: var(--dust); margin-bottom: 6px; }
input[type=password], input[type=text] { width: 100%; font: inherit; font-size: 16px; background: var(--rock-2); color: var(--ash); border: 1px solid var(--seam); border-radius: 12px; padding: 12px 13px; }
.conn { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dust); margin: 0 0 14px; }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--dust); }
.conn.on i { background: var(--moss); }
.drow { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.drow > span { font-size: 13px; color: var(--dust); }

/* ---------- planshet ---------- */
@media (max-width: 860px) {
  .pair, .mapwrap { grid-template-columns: minmax(0, 1fr); }
  .grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "sens" "ctrl" "log"; grid-template-rows: none; }
}
/* ---------- telefon ---------- */
@media (max-width: 560px) {
  :root { --pad: 16px; }
  body { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); font-size: 14.5px; }
  .wrap { gap: 14px; }
  .bar { gap: 6px; }
  .brand { gap: 10px; }
  .brand svg { width: 40px; height: 40px; }
  .brand b { font-size: 17px; }
  .brand small { display: none; }
  .status { width: 36px; height: 36px; padding: 0; justify-content: center; }
  .status span { display: none; }
  .ib { width: 36px; height: 36px; border-radius: 11px; }
  #bTheme { display: none; }
  .hero { border-radius: 22px; gap: 14px; }
  .hero-top { gap: 10px; }
  .gauge { width: 96px; height: 96px; }
  .gauge .val b { font-size: 34px; }
  .headline h1 { margin-top: 10px; }

<script src="i18n.js?v=5"></script>
<script>
(function () {
  var BROKER = 'wss://broker.hivemq.com:8884/mqtt';
  var USGS = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_week.geojson';
  var TASH = [41.311, 69.279];
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var root = document.documentElement;

  /* ---- language ---- */
  var lang = store.get('ah_lang');

  }
  function L() { return I18N[lang]; }
  function t(k, v) {
    var s = L()[k]; if (s == null) s = I18N.uz[k]; if (s == null) return k;
    if (v) for (var n in v) s = s.split('{' + n + '}').join(v[n]);
    return s;
  }
  function applyLang() {
    root.lang = lang;
    document.querySelectorAll('[data-i]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i')); });
    document.querySelectorAll('[data-ih]').forEach(function (el) { el.innerHTML = t(el.getAttribute('data-ih')); });
    $('bLang').textContent = L().code;
    $('bLang').title = t('lang_l');
    $('bSet').title = t('set_h'); $('bSet').setAttribute('aria-label', t('set_h'));
    $('bTheme').title = t('theme_l'); $('bTheme').setAttribute('aria-label', t('theme_l'));
    $('swSound').setAttribute('aria-label', t('buzzer'));
    $('swSiren').setAttribute('aria-label', t('siren'));
    $('swWebSound').setAttribute('aria-label', t('websound'));
    $('thr').setAttribute('aria-label', t('thr'));
    document.querySelectorAll('#segLang button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-l') === lang ? 'true' : 'false'); });
    notifyState(); render(); renderLog(); renderPass(); renderQuakes(); drawSpec();
  }
  function setLang(l) { lang = l; store.set('ah_lang', l); applyLang(); }
  $('bLang').onclick = function () { var order = ['uz', 'en', 'ru']; setLang(order[(order.indexOf(lang) + 1) % 3]); };
  document.querySelectorAll('#segLang button').forEach(function (b) { b.onclick = function () { setLang(b.getAttribute('data-l')); }; });

  /* ---- state ---- */
  var st = { g: 0, ball: 0, q: 0, f: 0, gas: 0, t: null, mute: 0, siren: 0, thr: 0.05, up: 0, rssi: 0 };
  var hist = [], HMAX = 600;                 // 10 namuna/s, 60 s
  var hx = [], hy = [], hz = [], XMAX = 512, XHZ = 20, XSHOW = 400; // 20 namuna/s
  var hasXYZ = false;
  var hover = -1;
  var client = null, demoTimer = null, demo = false;
  var devOnline = false, lastStatusAt = 0, wasAlarm = false;
  var webSound = store.get('ah_websound') !== '0';
  var events = [], passes = [];
  try { events = JSON.parse(store.get('ah_events') || '[]'); } catch (e) { events = []; }
  try { passes = JSON.parse(store.get('ah_pass') || '[]'); } catch (e) { passes = []; }
  var seenTs = {};

  var sc = $('scale');
  for (var i = 1; i <= 12; i++) sc.appendChild(document.createElement('i'));

  /* ---- theme ---- */
  var savedTheme = store.get('ah_theme');
  if (savedTheme) root.setAttribute('data-theme', savedTheme);
  function isDark() {
    return root.getAttribute('data-theme') === 'dark' || (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function setTheme(th) {
    root.setAttribute('data-theme', th); store.set('ah_theme', th);
    document.querySelectorAll('#segTheme button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-t') === th ? 'true' : 'false'); });
    redrawAll(); setTiles();
  }
  $('bTheme').onclick = function () { setTheme(isDark() ? 'light' : 'dark'); };
  document.querySelectorAll('#segTheme button').forEach(function (b) { b.onclick = function () { setTheme(b.getAttribute('data-t')); }; });
  document.querySelectorAll('#segTheme button').forEach(function (b) { b.setAttribute('aria-pressed', (b.getAttribute('data-t') === 'dark') === isDark() ? 'true' : 'false'); });

  /* ---- helpers ---- */
  function fmtTime(ts) {
    var d = ts ? new Date(ts * 1000) : new Date();
    return d.toLocaleString(L().locale, { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  function fmtUp(s) {
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h > 0 ? t('up_h', { h: h, m: m }) : t('up_m', { m: m, s: s % 60 });
  }
  function css(n) { return getComputedStyle(root).getPropertyValue(n).trim(); }
  function ballOf(g) { var a = g * 981; if (a < 3) return 0; return Math.max(1, Math.min(12, Math.floor(Math.log(a / 6) / Math.LN2) + 4)); }
  function sizeCanvas(c) {
    var dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    var x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
    return { x: x, w: w, h: h };
  }

  /* ---- render ---- */
  function render() {
    var alarm = !!(st.q || st.f || st.gas);
    var live = devOnline || demo;
    var b = $('banner');
    b.classList.toggle('alarm', alarm);
    b.classList.toggle('off', !alarm && !live);
    if (alarm && !wasAlarm) { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
    wasAlarm = alarm;

    var title, sub, state, guide = null;
    var ball = Number(st.ball) || 0;
    if (st.f) { state = t('state_danger'); title = t('t_fire'); sub = t('s_fire'); guide = L().guide_f; }
    else if (st.q) { state = t('state_danger'); title = t('t_quake', { b: ball }); sub = t('s_quake'); guide = L().guide_q; }
    else if (st.gas) { state = t('state_danger'); title = t('t_gas'); sub = t('s_gas'); guide = L().guide_g; }
    else if (live) { state = demo ? t('state_demo') : t('state_live'); title = t('t_calm'); sub = t('s_calm'); }
    else if (client && client.connected) { state = t('state_nolink'); title = t('t_nolink'); sub = t('s_nolink'); }
    else { state = t('state_connecting'); title = t('t_wait'); sub = store.get('ah_key') ? t('s_wait_key') : t('s_wait_nokey'); }
    $('bState').textContent = state; $('bTitle').textContent = title; $('bSub').textContent = sub;
    if (guide) {
      var gl = $('gList'); gl.innerHTML = '';
      guide.forEach(function (x) { var li = document.createElement('li'); li.textContent = x; gl.appendChild(li); });
    }

    $('ballN').textContent = ball;
    var fill = $('gFill');
    fill.style.strokeDashoffset = (235.6 * (1 - ball / 12)).toFixed(1);
    fill.style.stroke = ball >= 8 ? css('--lava') : ball >= 5 ? css('--amber') : css('--moss');
    var bars = sc.querySelectorAll('i');
    for (var i = 0; i < bars.length; i++) {
      var n = i + 1;
      bars[i].className = n <= ball ? 'on' + (n >= 8 ? ' h' : n >= 5 ? ' m' : '') : '';
    }
    var fb = document.createElement('b'); fb.textContent = t('ball_n', { b: ball }) + ' ';
    var ft = $('feelTxt'); ft.textContent = ''; ft.appendChild(fb); ft.appendChild(document.createTextNode(L().feel[Math.max(0, Math.min(12, ball))]));
    $('gNow').innerHTML = t('scope_now', { g: Number(st.g).toFixed(3), t: Number(st.thr).toFixed(2) });

    setSensor('tFire', !live ? '–' : st.f ? t('fire_bad') : t('normal'), live ? (st.f ? 'crit' : 'ok') : '');
    setSensor('tGas', !live ? '–' : st.gas ? t('gas_bad') : t('normal'), live ? (st.gas ? 'crit' : 'ok') : '');
    setSensor('tTemp', st.t == null || isNaN(st.t) ? '–' : st.t.toFixed(1) + ' °C', '');
    setSensor('tWifi', live && st.rssi ? st.rssi + ' dBm' : '–', '');
    setSensor('tUp', live ? fmtUp(st.up) : '–', '');

    $('swSound').setAttribute('aria-checked', st.mute ? 'false' : 'true');
    $('muteHint').textContent = st.mute ? t('buzz_off') : t('buzz_on');
    $('swSiren').setAttribute('aria-checked', st.siren ? 'true' : 'false');
    $('swWebSound').setAttribute('aria-checked', webSound ? 'true' : 'false');
    if (document.activeElement !== $('thr')) { $('thr').value = st.thr; $('thrV').textContent = Number(st.thr).toFixed(2) + ' g'; }

    var enabled = (!!client && client.connected) || demo;
    ['swSound', 'swSiren', 'bTest', 'bThr'].forEach(function (id) { $(id).disabled = !enabled; });

    var connected = demo || (client && client.connected);
    $('pConn').className = 'conn' + (connected ? ' on' : '');
    $('tConn').textContent = demo ? t('conn_demo') : connected ? t('conn_on') : t('conn_off');
    $('pDev').className = 'status' + (live ? ' on' : (client && client.connected ? ' bad' : ''));
    $('tDev').textContent = demo ? t('st_demo') : live ? t('st_on') : (client && client.connected ? t('st_off') : t('st_conn'));
    $('pDev').title = $('tDev').textContent;

    var showFw = live && !hasXYZ;
    $('fw1').classList.toggle('show', showFw); $('fw2').classList.toggle('show', showFw);
  }
  function setSensor(id, val, cls) {
    var el = $(id); el.className = 'sensor' + (cls ? ' ' + cls : '');
    el.querySelector('.v').textContent = val;
  }

  /* ---- alert log ---- */
  function renderLog() {
    var ul = $('log'); ul.innerHTML = '';
    $('logN').textContent = t('log_n', { n: events.length });
    if (!events.length) { var p = document.createElement('p'); p.className = 'empty'; p.textContent = t('log_empty'); ul.appendChild(p); return; }
    events.slice().reverse().forEach(function (e) {
      var li = document.createElement('li');
      var tx = e.txt.toLowerCase();
      li.className = tx.indexOf('olov') >= 0 ? 'f' : tx.indexOf('zilzila') >= 0 ? 'q' : '';
      var tm = document.createElement('time'); tm.textContent = fmtTime(e.ts);
      var d = document.createElement('div'); d.textContent = e.txt;
      li.appendChild(tm); li.appendChild(d); ul.appendChild(li);
    });
  }
  function addEvent(e) {
    if (!e || !e.txt) return;
    if (e.id) {
      if (events.some(function (x) { return x.id === e.id; })) return;
    } else {
      var key = (e.ts || 0) + '|' + e.txt;
      if (seenTs[key]) return; seenTs[key] = 1;
      if (e.ts && events.some(function (x) { return x.ts === e.ts && x.txt === e.txt; })) return;
    }
    if (!e.ts) e.ts = Math.floor(Date.now() / 1000);
    events.push({ id: e.id || 0, txt: e.txt, ts: e.ts });
    if (events.length > 100) events.shift();

      var vz = A * 0.4 * Math.sin(2 * Math.PI * 3.1 * ph) + n(quake ? 0.02 : 0.002) + 0.003 * Math.sin(2 * Math.PI * 7.5 * ph);
      x.push(Math.round(vx * 1000)); y.push(Math.round(vy * 1000)); z.push(Math.round(vz * 1000));
      g = Math.max(g, Math.sqrt(vx * vx + vy * vy + vz * vz));
      if (k % 2) { var big = Math.abs(vx) > Math.abs(vy) ? vx : vy; w.push(Math.round(big * 1000)); }
    }
    st.q = quake ? 1 : 0; st.f = now < fireUntil ? 1 : 0;
    st.ball = quake ? ballOf(g) : 0; st.up = Math.floor(dT / 2) + 3600;
    st.t = 24.5 + Math.sin(dT / 60);
    onStatus({ g: g, w: w, x: x, y: y, z: z });
  }
  function demoCmd(c) {
    if (c === 'test') { quakeUntil = Date.now() + 6000; addEvent({ txt: t('demo_ev'), ts: Math.floor(Date.now() / 1000) }); }
    if (c === 'mute') st.mute = 1; if (c === 'unmute') st.mute = 0;
    if (c === 'siren_on') st.siren = 1; if (c === 'siren_off') st.siren = 0;
    render();
  }

  /* ---- official earthquakes (USGS) ---- */
  var map = null, tiles = null, layer = null, quakes = null, qErr = false, tab = 'near';
  function distKm(a, b) {
    var R = 6371, toR = Math.PI / 180;
    var dLa = (b[0] - a[0]) * toR, dLo = (b[1] - a[1]) * toR;
    var s = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(a[0] * toR) * Math.cos(b[0] * toR) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  function setTiles() {
    if (!map) return;
    if (tiles) map.removeLayer(tiles);
    tiles = L_.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/' + (isDark() ? 'World_Dark_Gray_Base' : 'World_Light_Gray_Base') + '/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri', maxZoom: 16
    }).addTo(map);
  }
  var L_ = window.L;
  function initMap() {
    if (!L_ || map) return;
    var mobile = matchMedia('(pointer: coarse)').matches;
    map = L_.map('map', { zoomControl: true, attributionControl: true, dragging: !mobile, scrollWheelZoom: false, tap: false, worldCopyJump: true }).setView([40, 68], 4);
    setTiles();
    layer = L_.layerGroup().addTo(map);
    L_.circleMarker(TASH, { radius: 5, color: '#fff', weight: 2, fillColor: css('--moss'), fillOpacity: 1 }).addTo(map).bindTooltip('Toshkent');
  }
  function magCls(m) { return m >= 6 ? 'm6' : m >= 5 ? 'm5' : m >= 4 ? 'm4' : 'm3'; }
  function renderQuakes() {
    var ul = $('qlist'); ul.innerHTML = '';
    if (qErr) { ul.innerHTML = ''; var e = document.createElement('p'); e.className = 'empty'; e.textContent = t('map_err'); ul.appendChild(e); return; }
    if (!quakes) { var l = document.createElement('p'); l.className = 'empty'; l.textContent = t('map_loading'); ul.appendChild(l); return; }
    var list = quakes.slice();
    if (tab === 'near') list = list.filter(function (q) { return q.d <= 2000; }).sort(function (a, b) { return b.time - a.time; });
    else list = list.sort(function (a, b) { return b.mag - a.mag; }).slice(0, 25);
    if (layer) layer.clearLayers();
    if (!list.length) { var n = document.createElement('p'); n.className = 'empty'; n.textContent = t('map_none'); ul.appendChild(n); }
    list.forEach(function (q) {
      var li = document.createElement('li');
      var m = document.createElement('div'); m.className = 'mag ' + magCls(q.mag); m.textContent = q.mag.toFixed(1);
      var info = document.createElement('div');
      var pl = document.createElement('div'); pl.className = 'pl'; pl.textContent = q.place;
      var mt = document.createElement('div'); mt.className = 'mt';
      mt.textContent = fmtTime(Math.floor(q.time / 1000)) + ', ' + t('km_from', { d: Math.round(q.d) }) + ', ' + t('depth', { d: Math.round(q.depth) });
      info.appendChild(pl); info.appendChild(mt); li.appendChild(m); li.appendChild(info); ul.appendChild(li);
      if (layer) {
        var col = q.mag >= 6 ? css('--lava') : q.mag >= 5 ? css('--ember') : css('--amber');
        var mk = L_.circleMarker([q.lat, q.lon], { radius: 3 + (q.mag - 2) * 2.6, color: col, weight: 1.5, fillColor: col, fillOpacity: 0.35 }).addTo(layer);
        var pop = document.createElement('div');
        var pb = document.createElement('b'); pb.textContent = 'M' + q.mag.toFixed(1) + ' ';
        pop.appendChild(pb); pop.appendChild(document.createTextNode(q.place));
        pop.appendChild(document.createElement('br'));
        pop.appendChild(document.createTextNode(mt.textContent));
        mk.bindPopup(pop);
        li.onclick = function () { map.setView([q.lat, q.lon], Math.max(map.getZoom(), 5)); mk.openPopup(); };
      }
    });
    if (map && tab === 'near') map.setView([40, 68], 4);
    if (map && tab === 'world') map.setView([20, 40], 1);
  }
  function loadQuakes() {
    fetch(USGS).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (j) {
      qErr = false;
      quakes = (j.features || []).map(function (f) {
        var c = f.geometry.coordinates;
        return { mag: f.properties.mag || 0, place: f.properties.place || '', time: f.properties.time, lon: c[0], lat: c[1], depth: c[2] || 0, d: distKm(TASH, [c[1], c[0]]) };
      });
      renderQuakes();
    }).catch(function () { if (!quakes) { qErr = true; renderQuakes(); } });
  }
  function selTab(x) { tab = x; $('tabNear').setAttribute('aria-selected', x === 'near'); $('tabWorld').setAttribute('aria-selected', x === 'world'); renderQuakes(); }
  $('tabNear').onclick = function () { selTab('near'); };
  $('tabWorld').onclick = function () { selTab('world'); };

  function redrawAll() { draw(); drawAxes(); drawSpec(); renderPass(); if (quakes) renderQuakes(); }
  var rT = 0; window.addEventListener('resize', function () { clearTimeout(rT); rT = setTimeout(function () { redrawAll(); if (map) map.invalidateSize(); }, 150); });

  initMap();
  applyLang();
  draw(); drawAxes();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(redrawAll);
  loadQuakes(); setInterval(loadQuakes, 5 * 60 * 1000);
  if (store.get('ah_key')) connect();
})();

['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); }); });
document.addEventListener('dblclick', function (e) { e.preventDefault(); });
document.addEventListener('contextmenu', function (e) { if (e.target.tagName !== 'INPUT') e.preventDefault(); });
</script>
</body>
